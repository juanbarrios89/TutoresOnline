{% extends 'base.html' %}{% block title %}Reservar tutoría{% endblock %}{% block content %}<div class="auth-card"><p class="eyebrow">RESERVA</p><h1>Reservar con {{t['nombre']}} {{t['apellido']}}</h1><form method="post"><label>Materia</label><select name="materia_id" required><option value="">Seleccionar</option>{% for m in materias %}<option value="{{m['id']}}">{{m['nombre']}}</option>{% endfor %}</select><label>Fecha</label><input type="date" name="fecha" min="{{today}}" required><label>Hora</label><input type="time" name="hora" required><label>Modalidad</label><select name="modalidad"><option>Virtual</option><option>Presencial</option></select><label>¿Qué necesitas estudiar?</label><textarea name="tema" placeholder="Ej. Integrales por sustitución"></textarea><button class="btn primary full">Confirmar reserva</button></form></div>{% endblock %}
