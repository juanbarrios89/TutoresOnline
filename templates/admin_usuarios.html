{% extends 'base.html' %}{% block title %}Usuarios{% endblock %}{% block content %}<div class="pagehead"><h1>Usuarios</h1></div><table class="table"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acción</th></tr></thead><tbody>{% for u in usuarios %}<tr><td>{{u['nombre']}} {{u['apellido']}}</td><td>{{u['correo']}}</td><td>{{u['rol']}}</td><td>{{'Activo' if u['activo'] else 'Bloqueado'}}</td><td><form method="post" action="{{url_for('toggle_user',user_id=u['id'])}}"><button class="btn secondary">{{'Bloquear' if u['activo'] else 'Activar'}}</button></form></td></tr>{% endfor %}</tbody></table>{% endblock %}
