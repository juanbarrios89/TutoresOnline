{% extends 'base.html' %}{% block title %}Chat{% endblock %}{% block content %}<div class="chat"><h1>Chat con {{other['nombre']}} {{other['apellido']}}</h1><div class="card">{% for m in mensajes %}<div class="message {% if m['remitente_id']==session['usuario_id'] %}mine{% else %}theirs{% endif %}">{{m['mensaje']}}<br><small>{{m['creado_en']}}</small></div>{% else %}<p>Inicia la conversación.</p>{% endfor %}<form method="post" style="display:flex;gap:8px;margin-top:15px"><input name="mensaje" placeholder="Escribe un mensaje..." required><button class="btn primary">Enviar</button></form></div></div>{% endblock %}
