{% extends 'base.html' %}{% block title %}Disponibilidad{% endblock %}{% block content %}<h1>Mi disponibilidad</h1><div class="grid two"><div class="card"><h2>Agregar horario</h2><form method="post"><label>Día</label><select name="dia"><option>Lunes</option><option>Martes</option><option>Miércoles</option><option>Jueves</option><option>Viernes</option><option>Sábado</option></select><label>Hora inicio</label><input type="time" name="hora_inicio" required><label>Hora fin</label><input type="time" name="hora_fin" required><button class="btn primary full">Agregar</button></form></div><div class="card"><h2>Horarios actuales</h2>{% for s in slots %}<div class="mini"><span>{{s['dia']}} {{s['hora_inicio']}}–{{s['hora_fin']}}</span><form method="post" action="{{url_for('delete_slot',slot_id=s['id'])}}"><button class="btn secondary">Eliminar</button></form></div>{% else %}<p>No has agregado horarios.</p>{% endfor %}</div></div>{% endblock %}
